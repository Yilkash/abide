<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Abide</title>
<meta name="description" content="Daily Bible reading from Genesis to Revelation, healing scriptures, fasting, prayer and messages." />
<meta name="theme-color" content="#f6f4fb" id="themeColor" />
<script>try { if (localStorage.getItem("abide.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f4fb; --surface: #ffffff; --surface-2: #f0edf7; --ink: #1c1830; --ink-2: #4a4560; --muted: #8a849c;
    --line: #ebe7f3; --line-2: #ddd7ea; --brand: #3d2c8d; --brand-ink: #ffffff; --gold: #c08a1e; --gold-soft: #fbf1dc;
    --ok: #16804b; --ok-soft: #e4f3ea; --warn: #c2412d; --warn-soft: #fbe8e3;
    --hero-a: #2c1f6b; --hero-b: #6a4cc4; --hero-ink: #ffffff; --scrim: rgba(20,14,40,.4);
    --shadow: 0 1px 2px rgba(40,25,90,.05), 0 4px 14px rgba(40,25,90,.06);
    --read-size: 18px;
  }
  :root[data-theme="dark"] {
    --bg: #110e1c; --surface: #1b1729; --surface-2: #252036; --ink: #f1edfb; --ink-2: #c9c2de; --muted: #918aa8;
    --line: #2c2640; --line-2: #3b3453; --brand: #b9a6ff; --brand-ink: #160f33; --gold: #e6b24a; --gold-soft: #3a2e14;
    --ok: #5fd08f; --ok-soft: #16301f; --warn: #ff9580; --warn-soft: #3a1d17;
    --hero-a: #2a1d63; --hero-b: #4d36a0; --hero-ink: #fbf8ff; --scrim: rgba(0,0,0,.55); --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(84px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font-family: inherit; }
  svg { display: block; }
  .serif { font-family: Lora, Georgia, serif; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }

  header { padding: calc(14px + env(safe-area-inset-top)) 0 4px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .hello { font-size: 13px; color: var(--muted); font-weight: 500; }
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -.025em; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; }
  .h { font-size: 15px; font-weight: 600; margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .h small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .h button { border: 0; background: none; color: var(--brand); font-weight: 500; font-size: 13px; padding: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
  .pad { padding: 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .what { flex: 1; min-width: 0; }
  .row .what b { display: block; font-weight: 600; }
  .row .what span { color: var(--muted); font-size: 13px; }
  .tap { cursor: pointer; }
  .chev { color: var(--muted); }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }

  .btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 15px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn.danger { color: var(--warn); }
  .btn.block { width: 100%; }
  .btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .45; }
  .field { width: 100%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none; }
  .field:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  textarea.field { min-height: 120px; resize: vertical; line-height: 1.5; }
  .label { display: block; font-size: 13px; color: var(--muted); margin: 14px 2px 6px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.gold { background: var(--gold-soft); color: var(--gold); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.plain { background: var(--surface-2); color: var(--muted); }

  /* hero: verse of the day */
  .hero { background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,215,140,.35), transparent 70%); }
  .hero .kicker { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; font-weight: 600; }
  .hero .verse { font-family: Lora, Georgia, serif; font-size: 19px; line-height: 1.5; margin: 10px 0 10px; }
  .hero .ref { font-weight: 600; font-size: 14px; color: #ffd98a; }
  .hero .think { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.15); font-size: 13px; opacity: .85; }

  /* sessions */
  .session { display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .session:last-child { border-bottom: 0; }
  .session .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand); flex: 0 0 auto; }
  .session.now .ico { background: var(--brand); color: var(--brand-ink); }
  .session.done .ico { background: var(--ok-soft); color: var(--ok); }
  .session .body { flex: 1; min-width: 0; }
  .session .when { font-size: 12px; color: var(--muted); font-weight: 500; }
  .session .when .tag { margin-left: 6px; }
  .session .chs { font-weight: 600; font-size: 16px; margin: 1px 0 2px; }
  .session .sub { font-size: 13px; color: var(--muted); }
  .session .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--gold)); border-radius: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stats div { text-align: center; }
  .stats b { display: block; font-size: 20px; font-weight: 700; }
  .stats span { font-size: 12px; color: var(--muted); }

  /* fasting card */
  .fast { background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 18px; padding: 16px; }
  .fast .t { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .fast b { font-size: 16px; }
  .fast .left { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .fast .scr { font-family: Lora, Georgia, serif; font-size: 15px; margin: 12px 0 0; color: var(--ink); }
  .fast .scr em { font-style: normal; font-family: Inter, sans-serif; font-weight: 600; font-size: 12px; color: var(--gold); display: block; margin-top: 4px; }

  /* bible */
  .books { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .book { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 12px; }
  .book b { display: block; font-weight: 600; font-size: 14px; }
  .book span { font-size: 12px; color: var(--muted); }
  .book .bar { height: 3px; border-radius: 2px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
  .book .bar i { display: block; height: 100%; background: var(--gold); }
  .chapters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .chapters button { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-weight: 600; }
  .chapters button.read { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .reader { font-family: Lora, Georgia, serif; font-size: var(--read-size); line-height: 1.75; color: var(--ink); }
  .reader p { margin: 0 0 10px; }
  .reader sup { font-family: Inter, sans-serif; font-size: 11px; color: var(--gold); font-weight: 700; margin-right: 4px; vertical-align: 4px; }
  .reader .hl { background: var(--gold-soft); border-radius: 6px; box-shadow: 0 0 0 4px var(--gold-soft); }
  .reader-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 14px; }
  .context { font-size: 12px; color: var(--muted); }
  .reader-foot { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; margin: 20px 0 10px; }

  /* scriptures */
  .verse-card { padding: 16px; border-bottom: 1px solid var(--line); }
  .verse-card:last-child { border-bottom: 0; }
  .verse-card .vt { font-family: Lora, Georgia, serif; font-size: 16px; line-height: 1.6; }
  .verse-card .vr { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .verse-card .vr b { color: var(--brand); font-size: 13px; }
  .icon-btn { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 8px; display: inline-grid; place-items: center; }
  .icon-btn.on { color: var(--gold); }

  /* messages */
  .preacher { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: center; }
  .preacher:last-child { border-bottom: 0; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: 0 0 auto; }
  a.btn { color: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

  /* nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }
  nav button { border: 0; background: none; color: var(--muted); padding: 9px 2px 10px; font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button.on { color: var(--brand); font-weight: 600; }

  /* sheet + ask + toast */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; transform: translateY(105%); visibility: hidden; transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s .26s; }
  .sheet.open { transform: translateY(0); visibility: visible; transition: transform .26s cubic-bezier(.2,.8,.2,1); }
  .sheet .panel { max-width: 600px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 18px calc(16px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 4px auto 14px; }
  .sheet h3 { margin: 0; font-size: 18px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .ask { position: fixed; left: 50%; top: 50%; z-index: 41; width: min(340px, calc(100% - 32px)); background: var(--surface); border-radius: 22px; padding: 22px 20px 18px; text-align: center;
    transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none; transition: transform .18s ease, opacity .18s ease; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .ask.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .ask h3 { margin: 0 0 6px; font-size: 18px; }
  .ask p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
  .ask.danger #askYes { background: var(--warn); border-color: var(--warn); color: #fff; }
  .toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -20px); background: var(--brand); color: var(--brand-ink); padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px; opacity: 0; transition: all .22s; z-index: 45; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .update { position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top)); z-index: 35; max-width: 568px; margin: 0 auto; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); padding: 12px 16px; display: flex; justify-content: space-between; font-size: 14px; }
  .update b { color: var(--gold); }
  .switch { position: relative; width: 48px; height: 28px; border-radius: 14px; border: 0; background: var(--line-2); padding: 0; flex: 0 0 auto; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch.on { background: var(--brand); }
  .switch.on::after { transform: translateX(20px); }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; font-size: 14px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .view { animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="title-wrap"><button class="round hidden" id="backBtn" aria-label="Back"></button><div style="min-width:0"><div class="hello" id="hello"></div><div class="page-title" id="pageTitle">Today</div></div></div>
      <button class="round" id="themeBtn" aria-label="Dark mode"></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav><div class="wrap">
  <button data-tab="today" class="on"><span data-icon="sun"></span>Today</button>
  <button data-tab="bible"><span data-icon="book"></span>Bible</button>
  <button data-tab="word"><span data-icon="spark"></span>Scriptures</button>
  <button data-tab="messages"><span data-icon="play"></span>Messages</button>
  <button data-tab="more"><span data-icon="grid"></span>More</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetBody"></div></div>

<div class="scrim" id="askScrim" style="z-index:40"></div>
<div class="ask" id="ask" role="dialog" aria-modal="true">
  <h3 id="askTitle"></h3>
  <p id="askText"></p>
  <div class="two" style="margin-top:0"><button class="btn" id="askNo">Go back</button><button class="btn primary" id="askYes">Yes</button></div>
</div>
<div class="toast" id="toast"></div>
<button class="update hidden" id="updateBar"><span>New version ready</span><b>Tap to update</b></button>

<script>
// Abide: Bible in a set time, healing scriptures, fasting, prayer and messages. Everything stays on this phone.
const APP_VERSION = "abide-v1"; // must match CACHE in sw.js; bump both together
const PLAN_END = "2027-03-31";
const DATA = {"names":["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"],"themes":{"Healing":[{"ref":"Exodus 15:26","b":1,"c":15,"v":26,"text":"And said, If thou wilt diligently hearken to the voice of the LORD thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes, I will put none of these diseases upon thee, which I have brought upon the Egyptians: for I am the LORD that healeth thee."},{"ref":"Exodus 23:25","b":1,"c":23,"v":25,"text":"And ye shall serve the LORD your God, and he shall bless thy bread, and thy water; and I will take sickness away from the midst of thee."},{"ref":"Deuteronomy 7:15","b":4,"c":7,"v":15,"text":"And the LORD will take away from thee all sickness, and will put none of the evil diseases of Egypt, which thou knowest, upon thee; but will lay them upon all them that hate thee."},{"ref":"Psalms 30:2","b":18,"c":30,"v":2,"text":"O LORD my God, I cried unto thee, and thou hast healed me."},{"ref":"Psalms 103:2-3","b":18,"c":103,"v":2,"text":"Bless the LORD , O my soul, and forget not all his benefits: Who forgiveth all thine iniquities; who healeth all thy diseases;"},{"ref":"Psalms 107:20","b":18,"c":107,"v":20,"text":"He sent his word, and healed them, and delivered them from their destructions."},{"ref":"Psalms 118:17","b":18,"c":118,"v":17,"text":"I shall not die, but live, and declare the works of the LORD ."},{"ref":"Proverbs 4:20-22","b":19,"c":4,"v":20,"text":"My son, attend to my words; incline thine ear unto my sayings. Let them not depart from thine eyes; keep them in the midst of thine heart. For they are life unto those that find them, and health to all their flesh."},{"ref":"Isaiah 53:4-5","b":22,"c":53,"v":4,"text":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted. But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},{"ref":"Isaiah 58:8","b":22,"c":58,"v":8,"text":"Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward."},{"ref":"Jeremiah 17:14","b":23,"c":17,"v":14,"text":"Heal me, O LORD , and I shall be healed; save me, and I shall be saved: for thou art my praise."},{"ref":"Jeremiah 30:17","b":23,"c":30,"v":17,"text":"For I will restore health unto thee, and I will heal thee of thy wounds, saith the LORD ; because they called thee an Outcast, saying , This is Zion, whom no man seeketh after."},{"ref":"Jeremiah 33:6","b":23,"c":33,"v":6,"text":"Behold, I will bring it health and cure, and I will cure them, and will reveal unto them the abundance of peace and truth."},{"ref":"Malachi 4:2","b":38,"c":4,"v":2,"text":"But unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall."},{"ref":"Matthew 4:23-24","b":39,"c":4,"v":23,"text":"And Jesus went about all Galilee, teaching in their synagogues, and preaching the gospel of the kingdom, and healing all manner of sickness and all manner of disease among the people. And his fame went throughout all Syria: and they brought unto him all sick people that were taken with divers diseases and torments, and those which were possessed with devils, and those which were lunatick, and those that had the palsy; and he healed them."},{"ref":"Matthew 8:16-17","b":39,"c":8,"v":16,"text":"When the even was come, they brought unto him many that were possessed with devils: and he cast out the spirits with his word, and healed all that were sick: That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses."},{"ref":"Matthew 10:8","b":39,"c":10,"v":8,"text":"Heal the sick, cleanse the lepers, raise the dead, cast out devils: freely ye have received, freely give."},{"ref":"Mark 16:17-18","b":40,"c":16,"v":17,"text":"And these signs shall follow them that believe; In my name shall they cast out devils; they shall speak with new tongues; They shall take up serpents; and if they drink any deadly thing, it shall not hurt them; they shall lay hands on the sick, and they shall recover."},{"ref":"Luke 4:18","b":41,"c":4,"v":18,"text":"The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,"},{"ref":"Acts 10:38","b":43,"c":10,"v":38,"text":"How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him."},{"ref":"Romans 8:11","b":44,"c":8,"v":11,"text":"But if the Spirit of him that raised up Jesus from the dead dwell in you, he that raised up Christ from the dead shall also quicken your mortal bodies by his Spirit that dwelleth in you."},{"ref":"James 5:14-16","b":58,"c":5,"v":14,"text":"Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord: And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him. Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much."},{"ref":"1 Peter 2:24","b":59,"c":2,"v":24,"text":"Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed."},{"ref":"3 John 1:2","b":63,"c":1,"v":2,"text":"Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth."}],"Faith":[{"ref":"Hebrews 11:1","b":57,"c":11,"v":1,"text":"Now faith is the substance of things hoped for, the evidence of things not seen."},{"ref":"Hebrews 11:6","b":57,"c":11,"v":6,"text":"But without faith it is impossible to please him : for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him."},{"ref":"Romans 10:17","b":44,"c":10,"v":17,"text":"So then faith cometh by hearing, and hearing by the word of God."},{"ref":"Mark 11:22-24","b":40,"c":11,"v":22,"text":"And Jesus answering saith unto them, Have faith in God. For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith. Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them , and ye shall have them ."},{"ref":"Matthew 17:20","b":39,"c":17,"v":20,"text":"And Jesus said unto them, Because of your unbelief: for verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you."},{"ref":"Mark 9:23","b":40,"c":9,"v":23,"text":"Jesus said unto him, If thou canst believe, all things are possible to him that believeth."},{"ref":"Luke 1:37","b":41,"c":1,"v":37,"text":"For with God nothing shall be impossible."},{"ref":"2 Corinthians 5:7","b":46,"c":5,"v":7,"text":"(For we walk by faith, not by sight:)"},{"ref":"Galatians 2:20","b":47,"c":2,"v":20,"text":"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me."},{"ref":"1 John 5:4","b":61,"c":5,"v":4,"text":"For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, even our faith."},{"ref":"Ephesians 6:16","b":48,"c":6,"v":16,"text":"Above all, taking the shield of faith, wherewith ye shall be able to quench all the fiery darts of the wicked."},{"ref":"Romans 4:20-21","b":44,"c":4,"v":20,"text":"He staggered not at the promise of God through unbelief; but was strong in faith, giving glory to God; And being fully persuaded that, what he had promised, he was able also to perform."}],"Power & authority":[{"ref":"Luke 10:19","b":41,"c":10,"v":19,"text":"Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy: and nothing shall by any means hurt you."},{"ref":"Matthew 28:18-20","b":39,"c":28,"v":18,"text":"And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth. Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."},{"ref":"John 14:12-14","b":42,"c":14,"v":12,"text":"Verily, verily, I say unto you, He that believeth on me, the works that I do shall he do also; and greater works than these shall he do; because I go unto my Father. And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son. If ye shall ask any thing in my name, I will do it."},{"ref":"Acts 1:8","b":43,"c":1,"v":8,"text":"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judæa, and in Samaria, and unto the uttermost part of the earth."},{"ref":"Ephesians 1:19-21","b":48,"c":1,"v":19,"text":"And what is the exceeding greatness of his power to us-ward who believe, according to the working of his mighty power, Which he wrought in Christ, when he raised him from the dead, and set him at his own right hand in the heavenly places , Far above all principality, and power, and might, and dominion, and every name that is named, not only in this world, but also in that which is to come:"},{"ref":"Ephesians 2:6","b":48,"c":2,"v":6,"text":"And hath raised us up together, and made us sit together in heavenly places in Christ Jesus:"},{"ref":"Philippians 2:9-11","b":49,"c":2,"v":9,"text":"Wherefore God also hath highly exalted him, and given him a name which is above every name: That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth; And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father."},{"ref":"1 John 4:4","b":61,"c":4,"v":4,"text":"Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world."},{"ref":"2 Timothy 1:7","b":54,"c":1,"v":7,"text":"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind."},{"ref":"Matthew 16:19","b":39,"c":16,"v":19,"text":"And I will give unto thee the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven: and whatsoever thou shalt loose on earth shall be loosed in heaven."},{"ref":"Acts 3:6","b":43,"c":3,"v":6,"text":"Then Peter said, Silver and gold have I none; but such as I have give I thee: In the name of Jesus Christ of Nazareth rise up and walk."},{"ref":"Acts 4:29-31","b":43,"c":4,"v":29,"text":"And now, Lord, behold their threatenings: and grant unto thy servants, that with all boldness they may speak thy word, By stretching forth thine hand to heal; and that signs and wonders may be done by the name of thy holy child Jesus. And when they had prayed, the place was shaken where they were assembled together; and they were all filled with the Holy Ghost, and they spake the word of God with boldness."},{"ref":"Acts 19:11-12","b":43,"c":19,"v":11,"text":"And God wrought special miracles by the hands of Paul: So that from his body were brought unto the sick handkerchiefs or aprons, and the diseases departed from them, and the evil spirits went out of them."},{"ref":"Zechariah 4:6","b":37,"c":4,"v":6,"text":"Then he answered and spake unto me, saying, This is the word of the LORD unto Zerubbabel, saying, Not by might, nor by power, but by my spirit, saith the LORD of hosts."}],"The Spirit & the spirit realm":[{"ref":"John 4:24","b":42,"c":4,"v":24,"text":"God is a Spirit: and they that worship him must worship him in spirit and in truth."},{"ref":"1 Corinthians 2:9-12","b":45,"c":2,"v":9,"text":"But as it is written, Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him. But God hath revealed them unto us by his Spirit: for the Spirit searcheth all things, yea, the deep things of God. For what man knoweth the things of a man, save the spirit of man which is in him? even so the things of God knoweth no man, but the Spirit of God. Now we have received, not the spirit of the world, but the spirit which is of God; that we might know the things that are freely given to us of God."},{"ref":"2 Corinthians 4:18","b":46,"c":4,"v":18,"text":"While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal."},{"ref":"Ephesians 6:12","b":48,"c":6,"v":12,"text":"For we wrestle not against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this world, against spiritual wickedness in high places ."},{"ref":"Romans 8:14-16","b":44,"c":8,"v":14,"text":"For as many as are led by the Spirit of God, they are the sons of God. For ye have not received the spirit of bondage again to fear; but ye have received the Spirit of adoption, whereby we cry, Abba, Father. The Spirit itself beareth witness with our spirit, that we are the children of God:"},{"ref":"Romans 8:26","b":44,"c":8,"v":26,"text":"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered."},{"ref":"John 16:13","b":42,"c":16,"v":13,"text":"Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come."},{"ref":"1 Corinthians 12:7-11","b":45,"c":12,"v":7,"text":"But the manifestation of the Spirit is given to every man to profit withal. For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit; To another faith by the same Spirit; to another the gifts of healing by the same Spirit; To another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues: But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will."},{"ref":"Galatians 5:22-25","b":47,"c":5,"v":22,"text":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law. And they that are Christ’s have crucified the flesh with the affections and lusts. If we live in the Spirit, let us also walk in the Spirit."},{"ref":"2 Kings 6:16-17","b":11,"c":6,"v":16,"text":"And he answered, Fear not: for they that be with us are more than they that be with them. And Elisha prayed, and said, LORD , I pray thee, open his eyes, that he may see. And the LORD opened the eyes of the young man; and he saw: and, behold, the mountain was full of horses and chariots of fire round about Elisha."},{"ref":"Hebrews 1:14","b":57,"c":1,"v":14,"text":"Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?"},{"ref":"Jude 1:20","b":64,"c":1,"v":20,"text":"But ye, beloved, building up yourselves on your most holy faith, praying in the Holy Ghost,"}],"The Kingdom of God":[{"ref":"Matthew 6:33","b":39,"c":6,"v":33,"text":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."},{"ref":"Matthew 6:9-10","b":39,"c":6,"v":9,"text":"After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done in earth, as it is in heaven."},{"ref":"Mark 1:15","b":40,"c":1,"v":15,"text":"And saying, The time is fulfilled, and the kingdom of God is at hand: repent ye, and believe the gospel."},{"ref":"Luke 12:32","b":41,"c":12,"v":32,"text":"Fear not, little flock; for it is your Father’s good pleasure to give you the kingdom."},{"ref":"Luke 17:20-21","b":41,"c":17,"v":20,"text":"And when he was demanded of the Pharisees, when the kingdom of God should come, he answered them and said, The kingdom of God cometh not with observation: Neither shall they say, Lo here! or, lo there! for, behold, the kingdom of God is within you."},{"ref":"Romans 14:17","b":44,"c":14,"v":17,"text":"For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost."},{"ref":"1 Corinthians 4:20","b":45,"c":4,"v":20,"text":"For the kingdom of God is not in word, but in power."},{"ref":"Colossians 1:13","b":50,"c":1,"v":13,"text":"Who hath delivered us from the power of darkness, and hath translated us into the kingdom of his dear Son:"},{"ref":"Matthew 13:31-33","b":39,"c":13,"v":31,"text":"Another parable put he forth unto them, saying, The kingdom of heaven is like to a grain of mustard seed, which a man took, and sowed in his field: Which indeed is the least of all seeds: but when it is grown, it is the greatest among herbs, and becometh a tree, so that the birds of the air come and lodge in the branches thereof. Another parable spake he unto them; The kingdom of heaven is like unto leaven, which a woman took, and hid in three measures of meal, till the whole was leavened."},{"ref":"Daniel 2:44","b":26,"c":2,"v":44,"text":"And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, but it shall break in pieces and consume all these kingdoms, and it shall stand for ever."},{"ref":"Revelation 11:15","b":65,"c":11,"v":15,"text":"And the seventh angel sounded; and there were great voices in heaven, saying, The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever."}],"God's creation":[{"ref":"Genesis 1:1","b":0,"c":1,"v":1,"text":"In the beginning God created the heaven and the earth."},{"ref":"Genesis 1:26-28","b":0,"c":1,"v":26,"text":"And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth. So God created man in his own image, in the image of God created he him; male and female created he them. And God blessed them, and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it: and have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that moveth upon the earth."},{"ref":"Genesis 2:7","b":0,"c":2,"v":7,"text":"And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul."},{"ref":"Psalms 8:3-6","b":18,"c":8,"v":3,"text":"When I consider thy heavens, the work of thy fingers, the moon and the stars, which thou hast ordained; What is man, that thou art mindful of him? and the son of man, that thou visitest him? For thou hast made him a little lower than the angels, and hast crowned him with glory and honour. Thou madest him to have dominion over the works of thy hands; thou hast put all things under his feet:"},{"ref":"Psalms 19:1","b":18,"c":19,"v":1,"text":"The heavens declare the glory of God; and the firmament sheweth his handywork."},{"ref":"Psalms 139:13-14","b":18,"c":139,"v":13,"text":"For thou hast possessed my reins: thou hast covered me in my mother’s womb. I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well."},{"ref":"Isaiah 40:26-28","b":22,"c":40,"v":26,"text":"Lift up your eyes on high, and behold who hath created these things , that bringeth out their host by number: he calleth them all by names by the greatness of his might, for that he is strong in power; not one faileth. Why sayest thou, O Jacob, and speakest, O Israel, My way is hid from the LORD , and my judgment is passed over from my God? Hast thou not known? hast thou not heard, that the everlasting God, the LORD , the Creator of the ends of the earth, fainteth not, neither is weary? there is no searching of his understanding."},{"ref":"Jeremiah 32:17","b":23,"c":32,"v":17,"text":"Ah Lord GOD ! behold, thou hast made the heaven and the earth by thy great power and stretched out arm, and there is nothing too hard for thee:"},{"ref":"John 1:1-3","b":42,"c":1,"v":1,"text":"In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by him; and without him was not any thing made that was made."},{"ref":"Colossians 1:16-17","b":50,"c":1,"v":16,"text":"For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him: And he is before all things, and by him all things consist."},{"ref":"Hebrews 11:3","b":57,"c":11,"v":3,"text":"Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear."},{"ref":"Revelation 4:11","b":65,"c":4,"v":11,"text":"Thou art worthy, O Lord, to receive glory and honour and power: for thou hast created all things, and for thy pleasure they are and were created."}],"Prayer & fasting":[{"ref":"Isaiah 58:6-9","b":22,"c":58,"v":6,"text":"Is not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke? Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh? Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward. Then shalt thou call, and the LORD shall answer; thou shalt cry, and he shall say, Here I am . If thou take away from the midst of thee the yoke, the putting forth of the finger, and speaking vanity;"},{"ref":"Joel 2:12","b":28,"c":2,"v":12,"text":"Therefore also now, saith the LORD , turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning:"},{"ref":"Matthew 6:6","b":39,"c":6,"v":6,"text":"But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."},{"ref":"Matthew 6:16-18","b":39,"c":6,"v":16,"text":"Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward. But thou, when thou fastest, anoint thine head, and wash thy face; That thou appear not unto men to fast, but unto thy Father which is in secret: and thy Father, which seeth in secret, shall reward thee openly."},{"ref":"Matthew 17:21","b":39,"c":17,"v":21,"text":"Howbeit this kind goeth not out but by prayer and fasting."},{"ref":"Acts 13:2-3","b":43,"c":13,"v":2,"text":"As they ministered to the Lord, and fasted, the Holy Ghost said, Separate me Barnabas and Saul for the work whereunto I have called them. And when they had fasted and prayed, and laid their hands on them, they sent them away."},{"ref":"Ezra 8:23","b":14,"c":8,"v":23,"text":"So we fasted and besought our God for this: and he was intreated of us."},{"ref":"Daniel 9:3","b":26,"c":9,"v":3,"text":"And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:"},{"ref":"Jeremiah 33:3","b":23,"c":33,"v":3,"text":"Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not."},{"ref":"Philippians 4:6-7","b":49,"c":4,"v":6,"text":"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."},{"ref":"1 Thessalonians 5:17","b":51,"c":5,"v":17,"text":"Pray without ceasing."},{"ref":"Mark 11:24","b":40,"c":11,"v":24,"text":"Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them , and ye shall have them ."}],"Putting God first":[{"ref":"Matthew 22:37-38","b":39,"c":22,"v":37,"text":"Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the first and great commandment."},{"ref":"Proverbs 3:5-6","b":19,"c":3,"v":5,"text":"Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."},{"ref":"Romans 12:1-2","b":44,"c":12,"v":1,"text":"I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."},{"ref":"Joshua 1:8","b":5,"c":1,"v":8,"text":"This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success."},{"ref":"Joshua 24:15","b":5,"c":24,"v":15,"text":"And if it seem evil unto you to serve the LORD , choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD ."},{"ref":"Psalms 1:1-3","b":18,"c":1,"v":1,"text":"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful. But his delight is in the law of the LORD ; and in his law doth he meditate day and night. And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper."},{"ref":"Colossians 3:23-24","b":50,"c":3,"v":23,"text":"And whatsoever ye do, do it heartily, as to the Lord, and not unto men; Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ."},{"ref":"Mark 10:45","b":40,"c":10,"v":45,"text":"For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many."},{"ref":"1 Peter 4:10-11","b":59,"c":4,"v":10,"text":"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God. If any man speak, let him speak as the oracles of God; if any man minister, let him do it as of the ability which God giveth: that God in all things may be glorified through Jesus Christ, to whom be praise and dominion for ever and ever. Amen."},{"ref":"John 15:5","b":42,"c":15,"v":5,"text":"I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing."}],"Teaching the Word":[{"ref":"2 Timothy 2:15","b":54,"c":2,"v":15,"text":"Study to shew thyself approved unto God, a workman that needeth not to be ashamed, rightly dividing the word of truth."},{"ref":"2 Timothy 3:16-17","b":54,"c":3,"v":16,"text":"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness: That the man of God may be perfect, throughly furnished unto all good works."},{"ref":"2 Timothy 4:2","b":54,"c":4,"v":2,"text":"Preach the word; be instant in season, out of season; reprove, rebuke, exhort with all longsuffering and doctrine."},{"ref":"Deuteronomy 6:6-7","b":4,"c":6,"v":6,"text":"And these words, which I command thee this day, shall be in thine heart: And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up."},{"ref":"Colossians 3:16","b":50,"c":3,"v":16,"text":"Let the word of Christ dwell in you richly in all wisdom; teaching and admonishing one another in psalms and hymns and spiritual songs, singing with grace in your hearts to the Lord."},{"ref":"Matthew 28:19-20","b":39,"c":28,"v":19,"text":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."},{"ref":"James 3:1","b":58,"c":3,"v":1,"text":"My brethren, be not many masters, knowing that we shall receive the greater condemnation."},{"ref":"Isaiah 50:4","b":22,"c":50,"v":4,"text":"The Lord GOD hath given me the tongue of the learned, that I should know how to speak a word in season to him that is weary: he wakeneth morning by morning, he wakeneth mine ear to hear as the learned."}]}};

function rangeName(list) {
  const parts = [];
  for (const i of list) {
    const last = parts[parts.length - 1];
    if (last && last.b === CH[i].b && last.to === CH[i].c - 1) last.to = CH[i].c;
    else parts.push({ b: CH[i].b, from: CH[i].c, to: CH[i].c });
  }
  return parts.map((p) => `${NAMES[p.b]} ${p.from}${p.to > p.from ? "–" + p.to : ""}`).join(", ");
}

/* ---------- the reading plan ----------
   Each day takes an even share of what's left (by verses, so long chapters count for more) and
   splits it into morning, afternoon and night. A missed day is shared out over the days that remain. */
function planFor(day) {
  if (days[day]) return days[day];
  const unread = CH.map((_, i) => i).filter((i) => !read.has(i));
  const left = Math.max(1, dayDiff(day, PLAN_END) + 1);
  const remV = unread.reduce((s, i) => s + CH[i].n, 0);
  const target = remV / left;
  const take = [];
  let acc = 0;
  for (const i of unread) {
    if (take.length && acc + CH[i].n / 2 > target) break;
    take.push(i); acc += CH[i].n;
  }
  const parts = [[], [], []];
  let run = 0;
  for (const i of take) { const p = Math.min(2, Math.floor(((run + CH[i].n / 2) / Math.max(acc, 1)) * 3)); parts[p].push(i); run += CH[i].n; }
  // Never leave a part empty when there are enough chapters to go round.
  for (let p = 0; p < 3; p++) if (!parts[p].length) { const from = parts.reduce((m, x, k) => (x.length > parts[m].length ? k : m), 0); if (parts[from].length > 1) parts[p].push(p < from ? parts[from].shift() : parts[from].pop()); }
  parts.forEach((x) => x.sort((a, b) => a - b));
  days[day] = { parts };
  if (day === todayKey()) save("days", days);
  return days[day];
}
function markRead(i, on = true) {
  if (on === read.has(i)) return;
  const t = todayKey();
  if (on) { read.add(i); log[t] = (log[t] || 0) + 1; } else { read.delete(i); log[t] = Math.max(0, (log[t] || 0) - 1); }
  save("read", [...read]); save("log", log);
}
function streak() {
  let n = 0, d = todayKey();
  if (!log[d]) d = shiftDay(d, -1);
  while (log[d] > 0) { n++; d = shiftDay(d, -1); }
  return n;
}
function onTrack() {
  const total = dayDiff(start, PLAN_END) + 1;
  const passed = Math.min(total, dayDiff(start, todayKey()) + 1);
  // Only days already gone count; today's reading isn't late until tomorrow.
  const expected = Math.round((CH.length * (passed - 1)) / total);
  return read.size - expected; // negative = behind
}

    const isRead = read.has(i);
    const el = main(`

    $("restoreBtn").onclick = () => $("restore").click();
    $("restore").onchange = restore;
    $("resetPlan").onclick = async () => {
      if (!(await ask({ title: "Start again?", text: "Your chapters read and today's plan are cleared, and the plan starts from Genesis today. Your prayers, journal, lessons and fasts stay.", yes: "Start again", danger: true }))) return;
      read = new Set(); days = {}; log = {}; start = todayKey(); save("read", []); save("days", {}); save("log", {}); save("start", start); toast("Plan restarted"); go("today", {}, false);
    };
    renderInstall();
  },
};

function messageOfDay() { const n = dayNumber(); return { p: PREACHERS[n % PREACHERS.length], topic: TOPICS[(n * 3) % TOPICS.length] }; }

function fastCard(t) {
  const f = fasts[t] || {}, h = new Date().getHours() + new Date().getMinutes() / 60;
  const s = settings.fastStart, e = settings.fastEnd;
  const v = DATA.themes["Prayer & fasting"][dayNumber() % DATA.themes["Prayer & fasting"].length];
  const mins = Math.max(0, Math.round((e - h) * 60));
  const status = f.done ? "Fast completed. Well done!" : h < s ? `Starts at ${hourLabel(s)}` : h < e ? `Break your fast at ${hourLabel(e)} · ${Math.floor(mins / 60)}h ${mins % 60}m to go` : `Finished at ${hourLabel(e)}. Did you complete it?`;
  return `<div class="fast" data-fastcard>
    <div class="t"><div><b>Fasting today</b><div class="left">${status}</div></div>${f.done ? '<span class="tag ok">Done</span>' : ""}</div>
    <label class="label" for="fFocus">Focus of this fast</label>
    <input class="field" id="fFocus" list="focusList" value="${esc(f.focus || "")}" placeholder="e.g. ${FAST_FOCUS[dayNumber() % FAST_FOCUS.length]}" />
    <datalist id="focusList">${FAST_FOCUS.map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
    <div class="scr">${esc(v.text)}<em>${esc(v.ref)}</em></div>
    ${f.done ? "" : `<div style="margin-top:12px"><button class="btn gold block" data-fastdone>I completed today's fast</button></div>`}
  </div>`;
}
function wireFast(el, t) {
  const focus = el.querySelector("#fFocus");
  if (focus) focus.onchange = () => { fasts[t] = { ...(fasts[t] || {}), focus: focus.value.trim() }; save("fasts", fasts); };
  const done = el.querySelector("[data-fastdone]");
  if (done) done.onclick = () => openSheet(`
    <h3>Fast completed</h3>
    <label class="label" for="fNote">What did God show you? (optional)</label><textarea class="field serif" id="fNote" style="min-height:90px"></textarea>
    <div class="two"><button class="btn" id="fCancel">Cancel</button><button class="btn gold" id="fSave">Save</button></div>`, (s) => {
    s.querySelector("#fCancel").onclick = closeSheet;
    s.querySelector("#fSave").onclick = () => { fasts[t] = { ...(fasts[t] || {}), focus: focus?.value.trim() || fasts[t]?.focus || "", done: true, note: s.querySelector("#fNote").value.trim() }; save("fasts", fasts); closeSheet(); toast("Fast completed. God bless you!"); render(); };
  });
}

function editLesson(l) {
  const isNew = !l;
  l = l || { id: Date.now().toString(36), date: shiftDay(todayKey(), (7 - parseDay(todayKey()).getDay()) % 7 || 7), title: "", text: "", notes: "" };
  openSheet(`
    <h3>${isNew ? "New lesson" : "Lesson"}</h3>
    <label class="label" for="lTitle">Topic</label><input class="field" id="lTitle" value="${esc(l.title)}" placeholder="e.g. Jesus the Healer" />
    <label class="label" for="lDate">Sunday</label><input class="field" id="lDate" type="date" value="${esc(l.date)}" />
    <label class="label" for="lText">Bible text</label><input class="field" id="lText" value="${esc(l.text)}" placeholder="e.g. Mark 5:25–34" />
    <label class="label" for="lNotes">Main points and application</label><textarea class="field" id="lNotes" style="min-height:160px" placeholder="1. …&#10;2. …&#10;3. …&#10;&#10;How will the class live it this week?">${esc(l.notes)}</textarea>
    <div class="two">${isNew ? '<button class="btn" id="lCancel">Cancel</button>' : '<button class="btn danger" id="lDelete">Delete</button>'}<button class="btn primary" id="lSave">Save</button></div>`, (s) => {
    s.querySelector("#lCancel") && (s.querySelector("#lCancel").onclick = closeSheet);
    s.querySelector("#lDelete") && (s.querySelector("#lDelete").onclick = async () => { if (await ask({ title: "Delete this lesson?", text: l.title, yes: "Delete", danger: true })) { lessons = lessons.filter((x) => x.id !== l.id); save("lessons", lessons); closeSheet(); render(); } });
    s.querySelector("#lSave").onclick = () => {
      const title = s.querySelector("#lTitle").value.trim(); if (!title) return s.querySelector("#lTitle").focus();
      Object.assign(l, { title, date: s.querySelector("#lDate").value, text: s.querySelector("#lText").value.trim(), notes: s.querySelector("#lNotes").value });
      if (isNew) lessons.unshift(l);
      lessons.sort((a, b) => (a.date < b.date ? 1 : -1)); save("lessons", lessons); closeSheet(); toast("Lesson saved"); render();
    };
  });
}

/* ---------- backup ---------- */
const KEYS = ["settings", "read", "days", "log", "fasts", "prayers", "journal", "lessons", "favs", "saved", "start"];
function backup() {
  const data = { app: "abide", at: new Date().toISOString() };
  for (const k of KEYS) data[k] = load(k, null);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
  a.download = `abide-backup-${todayKey()}.json`;
  a.click();
}
function restore(e) {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(async (text) => {
    let data; try { data = JSON.parse(text); } catch { return toast("That file isn't an Abide backup"); }
    if (data.app !== "abide") return toast("That file isn't an Abide backup");
    if (!(await ask({ title: "Restore this backup?", text: `From ${new Date(data.at).toLocaleString()}. It replaces what's on this phone now.`, yes: "Restore", danger: true }))) return;
    for (const k of KEYS) if (data[k] != null) save(k, data[k]);
    location.reload();
  });
}

/* ---------- theme, font, install, update ---------- */
function setTheme(dark) {
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("abide.theme", dark ? "dark" : "light"); } catch {}
  $("themeColor").content = dark ? "#110e1c" : "#f6f4fb";
  $("themeBtn").innerHTML = dark ? ICONS.sunSmall : ICONS.moon;
}
const applyFont = () => document.documentElement.style.setProperty("--read-size", settings.font + "px");
$("themeBtn").onclick = () => { setTheme(document.documentElement.dataset.theme !== "dark"); if (route.view === "settings") render(); };
setTheme(document.documentElement.dataset.theme === "dark");
applyFont();

let installPrompt = null;
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function renderInstall() { const b = $("install"); if (!b) return; if (installed()) { b.textContent = "Installed"; b.disabled = true; } }
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; });
addEventListener("appinstalled", () => { installPrompt = null; toast("Installed"); renderInstall(); });
async function install() {
  if (installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; renderInstall(); return; }
  const help = $("installHelp");
  help.innerHTML = /iphone|ipad|ipod/i.test(navigator.userAgent) ? "In Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>." : "Tap your browser's menu <b>⋮</b>, then <b>Install app</b> or <b>Add to Home screen</b>.";
  help.classList.remove("hidden");
}
async function checkForUpdate() {
  try {
    const text = await (await fetch("sw.js?check=" + Date.now(), { cache: "no-store" })).text();
    const live = (text.match(/CACHE = "([^"]+)"/) || [])[1];
    $("updateBar").classList.toggle("hidden", !live || live === APP_VERSION);
  } catch {}
}
$("updateBar").onclick = () => location.reload();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkForUpdate(); if (route.view === "today") render(); } });
setInterval(checkForUpdate, 10 * 60 * 1000);

/* ---------- start ---------- */
$("backBtn").innerHTML = ICONS.back;
$("backBtn").onclick = back;
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => { trail.length = 0; go(b.dataset.tab, {}, false); }));
// Open straight to a section from a reminder link, e.g. …/#today
let first = "today";
try { first = location.hash.slice(1) || localStorage.getItem("abide.tab") || "today"; } catch {}
route = { view: VIEWS[first] && TAB_OF[first] === first ? first : "today" };
render();
checkForUpdate();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
