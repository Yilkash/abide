<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Abide</title>
<meta name="description" content="Daily Bible reading from Genesis to Revelation, healing scriptures, fasting, prayer and messages." />
<meta name="theme-color" content="#f6f4fb" id="themeColor" />
<script>try { if (localStorage.getItem("abide.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="title-wrap"><button class="round hidden" id="backBtn" aria-label="Back"></button><img class="app-icon hidden" id="appIcon" src="icon-192.png" alt="" width="38" height="38" /><div style="min-width:0"><div class="hello" id="hello"></div><div class="page-title" id="pageTitle">Today</div></div></div>
      <button class="round" id="themeBtn" aria-label="Dark mode"></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav><div class="wrap">
  <button data-tab="today" class="on"><span data-icon="sun"></span>Today</button>
  <button data-tab="bible"><span data-icon="book"></span>Bible</button>
  <button data-tab="word"><span data-icon="spark"></span>Scriptures</button>
  <button data-tab="messages"><span data-icon="play"></span>Messages</button>
  <button data-tab="more"><span data-icon="grid"></span>More</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetBody"></div></div>

<div class="scrim" id="askScrim" style="z-index:40"></div>
<div class="ask" id="ask" role="dialog" aria-modal="true">
  <h3 id="askTitle"></h3>
  <p id="askText"></p>
  <div class="two" style="margin-top:0"><button class="btn" id="askNo">Go back</button><button class="btn primary" id="askYes">Yes</button></div>
</div>
<div class="toast" id="toast"></div>
<button class="update hidden" id="updateBar"><span>New version ready</span><b>Tap to update</b></button>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/bible.js"></script>
<script src="js/niv.js"></script>
<script src="js/plan.js"></script>
<script src="js/ui.js"></script>
<script src="js/router.js"></script>
<script src="js/features/lock.js"></script>
<script src="js/features/today.js"></script>
<script src="js/features/declare.js"></script>
<script src="js/features/body.js"></script>
<script src="js/features/bible.js"></script>
<script src="js/features/word.js"></script>
<script src="js/features/messages.js"></script>
<script src="js/features/meditate.js"></script>
<script src="js/features/dreams.js"></script>
<script src="js/features/fasting.js"></script>
<script src="js/features/prayer.js"></script>
<script src="js/features/journal.js"></script>
<script src="js/features/lessons.js"></script>
<script src="js/features/more.js"></script>
<script src="js/reminders.js"></script>
<script src="js/backup.js"></script>
<script src="js/features/settings.js"></script>
<script src="js/shell.js"></script>
<script src="js/main.js"></script>
</body>
</html>
